[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privmap"
version = "1.0.8"
description = "Find Linux privilege escalation paths by modeling permissions as a graph."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "networkx>=3.0",
    "rich>=13.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
keywords = ["security", "linux", "privilege-escalation", "graph", "pentesting", "hardening"]

[project.urls]
Homepage = "https://github.com/isaacc2/privmap"
Documentation = "https://privmap.readthedocs.io/"
Repository = "https://github.com/isaacc2/privmap"
Issues = "https://github.com/isaacc2/privmap/issues"
Changelog = "https://github.com/isaacc2/privmap/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "mypy",
    "ruff",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-include-markdown-plugin>=6.2",
    "pymdown-extensions>=10.0",
]

[project.scripts]
privmap = "privmap.cli:main"

[tool.setuptools.packages.find]
include = ["privmap*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true