# Read the Docs build configuration for privmap.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# To activate this configuration on Read the Docs:
#   1. Import the GitHub repo at https://readthedocs.org/dashboard/import/
#   2. In the project Admin -> Settings, set "Default branch" to "main"
#   3. (Optional) Admin -> Advanced Settings: enable "Build pull requests"
#      for preview builds on PRs.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

# Pin docs dependencies via the ``docs`` extras in pyproject.toml so local
# previews (``pip install -e ".[docs]"``) and the RTD build stay in sync.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - pdf
